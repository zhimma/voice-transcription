version: '3.8'

services:
  voice-transcription:
    build: .
    container_name: voice-transcription-server
    ports:
      - "8765:8765"
    volumes:
      - ./models:/root/.voice-transcription/models
      - ./config:/root/.voice-transcription/config
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 可选：添加反向代理
  nginx:
    image: nginx:alpine
    container_name: voice-transcription-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - voice-transcription
    restart: unless-stopped
    profiles:
      - with-nginx
